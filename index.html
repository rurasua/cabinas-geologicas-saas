<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabinas Geológicas — Panel de control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f0;
      --surface: #ffffff;
      --line: #e9e3d6;
      --line-soft: #f0ebde;
      --ink: #14171e;
      --ink-2: #3a4256;
      --muted: #7c7a72;
      --primary: #2f6f5e;
      --primary-deep: #1d4a3d;
      --primary-soft: rgba(47, 111, 94, 0.08);
      --accent: #c97b3f;
      --accent-soft: rgba(201, 123, 63, 0.08);
      --warn: #b06367;
      --warn-soft: rgba(176, 99, 103, 0.08);
      --gold: #b08a3e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      font-size: 15px;
    }
    h1, h2, h3, h4 { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: inherit; font-size: inherit; }

    /* ===== LAYOUT ===== */
    #app { display: flex; min-height: 100vh; }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 50;
      transition: transform 0.3s;
    }
    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .logo-mark {
      width: 36px; height: 36px;
      background: var(--primary);
      color: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      font-weight: 400;
    }
    .logo-text { font-family: 'DM Serif Display', serif; font-size: 1.05rem; color: var(--ink); }
    .logo-text small { display: block; font-family: 'Outfit', sans-serif; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }

    .logo-block { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .logo-img { width: 168px; height: auto; display: block; }
    .logo-slogan { width: 138px; height: auto; display: block; opacity: 0.78; }

    .sidebar-nav { flex: 1; padding: 1rem 0.75rem; overflow-y: auto; }
    .nav-section { margin-bottom: 1.5rem; }
    .nav-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0 0.75rem; margin-bottom: 0.4rem; }
    .nav-item {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      color: var(--ink-2);
      font-size: 0.93rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-item:hover { background: var(--bg); }
    .nav-item.active { background: var(--primary-soft); color: var(--primary-deep); }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-sub { margin-left: 1.5rem; margin-top: 0.25rem; display: none; }
    .nav-sub.open { display: block; }
    .nav-sub-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--ink-2);
      cursor: pointer;
    }
    .nav-sub-item:hover { background: var(--bg); }
    .nav-sub-item.active { color: var(--primary); font-weight: 600; }
    .nav-sub-item::before { content: "·"; color: var(--muted); }

    .sidebar-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 0.7rem;
    }
    .user-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 0.85rem; font-weight: 500; color: var(--ink); }
    .user-email { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ===== MAIN ===== */
    #main { flex: 1; margin-left: 280px; min-width: 0; }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 20;
    }
    .menu-toggle { display: none; padding: 0.5rem; border-radius: 6px; }
    .menu-toggle:hover { background: var(--bg); }
    .breadcrumb { font-size: 0.9rem; color: var(--muted); }
    .breadcrumb strong { color: var(--ink); font-weight: 500; }
    .topbar-actions { display: flex; align-items: center; gap: 0.75rem; }

    .content { padding: 2rem; max-width: 1200px; }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .btn-primary { background: var(--primary); color: var(--surface); }
    .btn-primary:hover { background: var(--primary-deep); }
    .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
    .btn-secondary:hover { background: var(--bg); }
    .btn-ghost { color: var(--ink-2); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-danger { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
    .btn svg { width: 16px; height: 16px; }

    /* ===== VIEW HEADER ===== */
    .view-header { margin-bottom: 2rem; }
    .view-title { font-size: 2rem; margin-bottom: 0.4rem; color: var(--ink); }
    .view-subtitle { color: var(--muted); font-size: 1rem; }
    .view-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; flex-wrap: wrap; }

    /* ===== METRIC CARDS ===== */
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2.5rem; }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.2s;
    }
    .metric-card:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .metric-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .metric-value { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--ink); line-height: 1; }
    .metric-sub { font-size: 0.78rem; color: var(--muted); margin-top: 0.4rem; }
    .metric-trend { font-size: 0.75rem; color: var(--primary); margin-top: 0.4rem; }

    /* ===== CARDS / SECTIONS ===== */
    .section-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .section-card h3 { font-size: 1.3rem; margin-bottom: 0.5rem; }
    .section-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }

    /* ===== STATUS BADGE ===== */
    .badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-active { background: var(--primary-soft); color: var(--primary-deep); }
    .badge-completed { background: var(--bg); color: var(--muted); }
    .badge-manifestation { background: var(--warn-soft); color: var(--warn); }
    .badge-pending { background: var(--accent-soft); color: var(--accent); }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* ===== CABIN LIST (Dashboard) ===== */
    .cabin-list { display: grid; gap: 1rem; }
    .cabin-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.25rem;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cabin-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.06); border-color: var(--primary); }
    .cabin-icon {
      width: 56px; height: 56px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .cabin-icon svg { width: 28px; height: 28px; }
    .cabin-name { font-family: 'DM Serif Display', serif; font-size: 1.25rem; margin-bottom: 0.2rem; }
    .cabin-meta { color: var(--muted); font-size: 0.85rem; }
    .cabin-stats { display: flex; gap: 1.5rem; text-align: right; }
    .cabin-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 500; color: var(--ink); }
    .cabin-stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* ===== TABS ===== */
    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--line); margin-bottom: 1.5rem; }
    .tab {
      padding: 0.7rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* ===== TABLES ===== */
    .params-table { width: 100%; border-collapse: collapse; }
    .params-table th { text-align: left; padding: 0.6rem 0.75rem; font-size: 0.75rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; border-bottom: 1px solid var(--line); font-weight: 500; }
    .params-table td { padding: 0.75rem; font-size: 0.9rem; border-bottom: 1px solid var(--line-soft); }
    .params-table tr:last-child td { border-bottom: none; }
    .params-table .num { font-family: 'JetBrains Mono', monospace; text-align: right; }
    .params-table .label { color: var(--ink-2); }

    /* ===== REPORT VIEW (SIOP) ===== */
    .report-header {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .report-title { font-family: 'DM Serif Display', serif; font-size: 1.8rem; margin-bottom: 0.5rem; }
    .report-meta { display: flex; gap: 1.5rem; flex-wrap: wrap; color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .report-meta strong { color: var(--ink); font-weight: 500; }
    .report-body { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 2rem; }
    .report-section { margin-bottom: 2rem; }
    .report-section:last-child { margin-bottom: 0; }
    .report-section h4 { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.75rem; }
    .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem 1.5rem; }
    .report-grid-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px dashed var(--line-soft); }
    .report-grid-item span:first-child { color: var(--ink-2); font-size: 0.9rem; }
    .report-grid-item span:last-child { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--ink); }
    .observations { background: var(--bg); padding: 1rem; border-radius: 8px; border-left: 3px solid var(--accent); font-size: 0.92rem; color: var(--ink-2); }

    /* ===== WIZARD ===== */
    .wizard-stepper { display: flex; align-items: center; justify-content: center; margin-bottom: 2.5rem; }
    .wizard-step { display: flex; align-items: center; gap: 0.6rem; }
    .wizard-dot { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); color: var(--muted); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; flex-shrink: 0; }
    .wizard-dot.active { background: var(--primary); color: var(--surface); border-color: var(--primary); }
    .wizard-dot.done { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
    .wizard-label { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
    .wizard-label.active, .wizard-label.done { color: var(--primary); }
    .wizard-line { width: 60px; height: 2px; background: var(--line); margin: 0 1rem; }
    .wizard-line.done { background: var(--primary); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem 1.5rem; }
    .form-field { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-field.span-2 { grid-column: 1 / -1; }
    .form-field label { font-size: 0.85rem; color: var(--ink-2); font-weight: 500; }
    .form-field input, .form-field select, .form-field textarea { padding: 0.6rem 0.75rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 0.95rem; transition: all 0.15s; }
    .form-field input::placeholder, .form-field textarea::placeholder { color: #c4c0b6; font-style: italic; opacity: 1; }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .form-field input:disabled { background: var(--bg); color: var(--muted); }
    .form-field .help { font-size: 0.75rem; color: var(--muted); }
    .checkbox-row { display: flex; gap: 1.5rem; margin-top: 0.4rem; }
    .checkbox-row label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.9rem; color: var(--ink-2); }

    .form-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding: 1.25rem 1.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .form-actions .right { display: flex; gap: 0.75rem; }

    .summary-list { display: grid; gap: 0.25rem; }
    .summary-item { display: flex; justify-content: space-between; padding: 0.55rem 0; border-bottom: 1px dashed var(--line-soft); }
    .summary-item:last-child { border-bottom: none; }
    .summary-item .label { color: var(--muted); font-size: 0.9rem; }
    .summary-item .value { color: var(--ink); font-size: 0.95rem; font-weight: 500; text-align: right; }

    /* ===== UPLOAD ===== */
    .upload-zone {
      background: var(--surface);
      border: 2px dashed var(--line);
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); background: var(--primary-soft); }
    .upload-zone svg { width: 48px; height: 48px; color: var(--muted); margin-bottom: 1rem; }
    .upload-zone h3 { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 1.1rem; margin-bottom: 0.4rem; }
    .upload-zone p { color: var(--muted); font-size: 0.9rem; }
    .upload-preview {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .upload-preview-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .preview-table { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; width: 100%; border-collapse: collapse; }
    .preview-table th, .preview-table td { padding: 0.4rem 0.6rem; text-align: left; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
    .preview-table th { background: var(--bg); color: var(--muted); text-transform: uppercase; font-size: 0.7rem; }

    /* ===== MANIFESTATION ===== */
    .manifest-hero {
      background: linear-gradient(135deg, var(--warn-soft) 0%, var(--surface) 100%);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .manifest-hero h2 { color: var(--warn); margin-bottom: 0.5rem; }
    .manifest-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-top: 1.5rem; }
    .manifest-stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.3rem; }
    .manifest-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; color: var(--ink); }

    /* ===== LOGIN ===== */
    .login-screen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      padding: 2rem;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.04);
    }
    .login-logo { width: 64px; height: 64px; background: var(--primary); color: var(--accent); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 1.6rem; margin-bottom: 1.5rem; }
    .login-card h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .login-logos { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 1.8rem; }
    .login-logo-img { width: 240px; height: auto; display: block; }
    .login-logo-slogan { width: 200px; height: auto; display: block; opacity: 0.78; }
    .login-card p { color: var(--muted); margin-bottom: 2rem; font-size: 0.95rem; }
    .btn-google {
      width: 100%;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      transition: all 0.15s;
    }
    .btn-google:hover { background: var(--bg); border-color: var(--ink-2); }
    .login-foot { margin-top: 1.5rem; font-size: 0.78rem; color: var(--muted); }

    /* ===== TOAST ===== */
    #toast-container { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 200; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast {
      background: var(--ink);
      color: var(--surface);
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      font-size: 0.9rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: flex; align-items: center; gap: 0.6rem;
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      #sidebar { width: 240px; }
      #main { margin-left: 240px; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #main { margin-left: 0; }
      .menu-toggle { display: inline-flex; }
      .content { padding: 1.25rem; }
      .topbar { padding: 0.75rem 1.25rem; }
      .metrics-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      .report-grid, .manifest-stats { grid-template-columns: 1fr; }
      .cabin-card { grid-template-columns: 1fr; }
      .cabin-stats { text-align: left; }
      .charts-grid { grid-template-columns: 1fr; }
    }

    /* ===== VISOR DE PARÁMETROS ===== */
    .visor-controls {
      display: flex; flex-direction: column; gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .visor-info { font-size: 0.92rem; color: var(--ink-2); }
    .visor-info strong { color: var(--ink); font-family: 'DM Serif Display', serif; font-size: 1.05rem; }
    .visor-info .mono { color: var(--muted); font-size: 0.85rem; }
    .visor-legend { display: flex; gap: 1.5rem; flex-wrap: wrap; padding-top: 0.5rem; border-top: 1px solid var(--line-soft); }
    .legend-item { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--ink-2); }
    .legend-line { display: inline-block; width: 18px; height: 3px; border-radius: 2px; }
    .legend-dash { display: inline-block; width: 18px; height: 0; border-top: 1px dashed var(--muted); }
    .legend-warn { display: inline-block; width: 18px; height: 0; border-top: 1px dashed var(--warn); }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
    }
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.2s;
    }

      { prof: 3950, gas: 250, c1: 240, c2: 8, c3: 2, ic4: 0, nc4: 0, ic5: 0, nc5: 0 },
      { prof: 4000, gas: 180, c1: 175, c2: 4, c3: 1, ic4: 0, nc4: 0, ic5: 0, nc5: 0 },
      { prof: 4050, gas: 220, c1: 215, c2: 4, c3: 1, ic4: 0, nc4: 0, ic5: 0, nc5: 0 },
      { prof: 4100, gas: 250, c1: 240, c2: 8, c3: 2, ic4: 0, nc4: 0, ic5: 0, nc5: 0 },
      { prof: 4150, gas: 180, c1: 175, c2: 4, c3: 1, ic4: 0, nc4: 0, ic5: 0, nc5: 0 },
    ];

    /* ======================== UTILIDADES ======================== */
    const fmt = (n, d=0) => Number(n).toLocaleString('es-MX', { minimumFractionDigits: d, maximumFractionDigits: d });
    const getCabin = (id) => MOCK_CABINS.find(c => c.id === id);
    const getReport = (id) => MOCK_REPORTS.find(r => r.id === id);

    const showToast = (msg) => {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `${ICONS.check} <span>${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    };

    const navigate = (hash) => { window.location.hash = hash; };

    /* ======================== VISOR DE PARÁMETROS (SVG INLINE) ======================== */
    // Genera una mini-gráfica SVG con eje Y de profundidad (invertido) y eje X del parámetro.
    // opts: { field, label, unit, color, min, max, logScale, manifestProf }
    const drawLineChart = (data, opts) => {
      const W = 620, H = 220;
      const padL = 56, padR = 24, padT = 14, padB = 36;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;
      const profMin = 2500, profMax = 4162;

      const valMin = opts.min;
      const valMax = opts.max;
      const useLog = opts.logScale && valMin > 0;

      // Escala X (lineal o log)
      const xScale = (v) => {
        if (useLog) {
          const lmin = Math.log10(valMin), lmax = Math.log10(valMax);
          return padL + (Math.log10(Math.max(v, valMin)) - lmin) / (lmax - lmin) * innerW;
        }
        return padL + (v - valMin) / (valMax - valMin) * innerW;
      };
      // Escala Y invertida (0 = superficie, 4162 = fondo)
      const yScale = (p) => padT + (profMax - p) / (profMax - profMin) * innerH;

      // Construir path
      const pts = data.filter(d => d[opts.field] != null && d[opts.field] !== undefined);
      const path = pts.map((d, i) => `${i === 0 ? 'M' : 'L'} ${xScale(d[opts.field]).toFixed(1)} ${yScale(d.prof).toFixed(1)}`).join(' ');

      // Marcar pico (manifestación) si aplica
      let manifestMark = '';
      if (opts.manifestProf) {
        const yM = yScale(opts.manifestProf);
        manifestMark = `<line x1="${padL}" y1="${yM.toFixed(1)}" x2="${(W - padR).toFixed(1)}" y2="${yM.toFixed(1)}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
          <text x="${(W - padR - 4).toFixed(1)}" y="${(yM - 4).toFixed(1)}" text-anchor="end" font-family="JetBrains Mono" font-size="9" fill="var(--warn)">⚠ ${opts.manifestProf} m</text>`;
      }

      // Marcar promedio
      const avg = pts.reduce((s, d) => s + d[opts.field], 0) / pts.length;
      const xAvg = xScale(avg);
      const avgMark = `<line x1="${xAvg.toFixed(1)}" y1="${padT}" x2="${xAvg.toFixed(1)}" y2="${(H - padB).toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2,4" opacity="0.4"/>`;

      // Marcar puntos individuales
      const dots = pts.map(d => `<circle cx="${xScale(d[opts.field]).toFixed(1)}" cy="${yScale(d.prof).toFixed(1)}" r="2" fill="${opts.color}" opacity="0.7"/>`).join('');

      // Etiquetas eje Y (profundidad) - cada 500m
      const yLabels = [];
      for (let p = 2500; p <= 4162; p += 500) {
        yLabels.push(`<text x="${padL - 8}" y="${(yScale(p) + 3).toFixed(1)}" text-anchor="end" font-family="JetBrains Mono" font-size="9" fill="var(--muted)">${p.toLocaleString('es-MX')}</text>
          <line x1="${padL - 3}" y1="${yScale(p).toFixed(1)}" x2="${padL}" y2="${yScale(p).toFixed(1)}" stroke="var(--muted)" opacity="0.4"/>`);
      }

      // Etiquetas eje X (valor) - 5 marcas
      const xLabels = [];
      const xStep = (valMax - valMin) / 4;
      for (let i = 0; i <= 4; i++) {
        const v = valMin + xStep * i;
        const x = xScale(v);
        const label = useLog
          ? (v >= 1000 ? `${(v/1000).toFixed(1)}k` : `${v}`)
          : (v % 1 === 0 ? v.toFixed(0) : v.toFixed(1));
        xLabels.push(`<text x="${x.toFixed(1)}" y="${(H - padB + 16).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="var(--muted)">${label}</text>
          <line x1="${x.toFixed(1)}" y1="${(H - padB).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(H - padB + 3).toFixed(1)}" stroke="var(--muted)" opacity="0.4"/>`);
      }

      // Líneas de grid horizontales
      const gridLines = [];
      for (let p = 2500; p <= 4162; p += 500) {
        gridLines.push(`<line x1="${padL}" y1="${yScale(p).toFixed(1)}" x2="${(W - padR).toFixed(1)}" y2="${yScale(p).toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`);
      }

      // Bordes del área de gráfica
      const frame = `<rect x="${padL}" y="${padT}" width="${innerW}" height="${innerH}" fill="none" stroke="var(--line)" stroke-width="1"/>`;

      return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:'Outfit',sans-serif">
        ${gridLines.join('')}
        ${frame}
        ${avgMark}
        ${path ? `<path d="${path}" fill="none" stroke="${opts.color}" stroke-width="1.5" stroke-linejoin="round"/>` : ''}
        ${dots}
        ${manifestMark}
        ${xLabels.join('')}
        ${yLabels.join('')}
        <text x="${padL}" y="${(H - 6).toFixed(1)}" font-size="9" fill="var(--muted)">${opts.label} (${opts.unit})</text>
        <text x="${(W - padR).toFixed(1)}" y="${(H - 6).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)">Promedio: ${useLog ? avg.toFixed(0) : (avg % 1 === 0 ? avg.toFixed(0) : avg.toFixed(2))}</text>
      </svg>`;
    };

    // Card individual de gráfica con título, métricas y SVG
    const chartCard = (title, subtitle, value, sub, svg) => `
      <div class="chart-card">
        <div class="chart-card-head">
          <div>
            <div class="chart-card-title">${title}</div>
            <div class="chart-card-sub">${subtitle}</div>
          </div>
          <div class="chart-card-value">
            <div class="chart-card-big">${value}</div>
            <div class="chart-card-mini">${sub}</div>
          </div>
        </div>
        <div class="chart-card-svg">${svg}</div>
      </div>`;

    /* ======================== VISTA: VISOR DE PARÁMETROS ======================== */
    // Mapeo de cabina -> dataset. Solo Kali-10 tiene datos de momento.
    // Para otras cabinas se muestra empty state.
    const VISOR_DATA = {
      'mulach-12': { params: PARAMS_MULACH, croma: CROMA_MULACH, label: 'Kali-10', etapa: '12.25" → 8.5"' },
      'pokche-12': null,
    };

    const renderVisor = (cabinId) => {
      const dataset = VISOR_DATA[cabinId];
      if (!dataset) {
        return `
          <div class="visor-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M3 9h18M9 3v18"/>
            </svg>
            <h3>Sin datos de parámetros</h3>
            <p>Esta cabina aún no tiene series de tiempo de parámetros o cromatografía cargadas.</p>
            <p class="muted">Los datos disponibles son únicamente de <strong>Kali-10</strong> (CSV BASE GENERAL y TABLA CROMATOGRAFIA del proyecto).</p>
          </div>`;
      }

      const { params, croma, label, etapa } = dataset;
      // Calcular promedios
      const avg = (arr, key) => arr.reduce((s, d) => s + d[key], 0) / arr.length;
      const min = (arr, key) => Math.min(...arr.map(d => d[key]));
      const max = (arr, key) => Math.max(...arr.map(d => d[key]));

      const charts = [
        {
          field: 'wob', label: 'WOB (Peso sobre barrena)', unit: 'ton', color: 'var(--primary)',
          min: 0, max: 12, manifestProf: null,
          avgVal: avg(params, 'wob'), minVal: min(params, 'wob'), maxVal: max(params, 'wob'),
        },
        {
          field: 'rpm', label: 'RPM', unit: 'rpm', color: 'var(--primary)',
          min: 0, max: 160, manifestProf: null,
          avgVal: avg(params, 'rpm'), minVal: min(params, 'rpm'), maxVal: max(params, 'rpm'),
        },
        {
          field: 'spp', label: 'Presión de bomba (SPP)', unit: 'psi', color: 'var(--primary)',
          min: 0, max: 4200, manifestProf: null,
          avgVal: avg(params, 'spp'), minVal: min(params, 'spp'), maxVal: max(params, 'spp'),
        },
        {
          field: 'gpm', label: 'Gasto (GPM)', unit: 'gpm', color: 'var(--primary)',
          min: 0, max: 1000, manifestProf: null,
          avgVal: avg(params, 'gpm'), minVal: min(params, 'gpm'), maxVal: max(params, 'gpm'),
        },
        {
          field: 'denIn', label: 'Densidad lodo entrada', unit: 'g/cm³', color: 'var(--accent)',
          min: 1.45, max: 1.60, manifestProf: null,
          avgVal: avg(params, 'denIn'), minVal: min(params, 'denIn'), maxVal: max(params, 'denIn'),
        },
        {
          field: 'denOut', label: 'Densidad lodo salida', unit: 'g/cm³', color: 'var(--accent)',
          min: 1.45, max: 1.60, manifestProf: null,
          avgVal: avg(params, 'denOut'), minVal: min(params, 'denOut'), maxVal: max(params, 'denOut'),
        },
        {
          field: 'tempIn', label: 'Temperatura entrada', unit: '°C', color: 'var(--gold)',
          min: 38, max: 50, manifestProf: null,
          avgVal: avg(params, 'tempIn'), minVal: min(params, 'tempIn'), maxVal: max(params, 'tempIn'),
        },
        {
          field: 'tempOut', label: 'Temperatura salida', unit: '°C', color: 'var(--gold)',
          min: 50, max: 60, manifestProf: null,
          avgVal: avg(params, 'tempOut'), minVal: min(params, 'tempOut'), maxVal: max(params, 'tempOut'),
        },
        {
          field: 'gas', label: 'Gas total (C1+)', unit: 'ppm', color: 'var(--warn)',
          min: 0, max: 11000, manifestProf: 3580, logScale: true,
          avgVal: avg(croma, 'gas'), minVal: min(croma, 'gas'), maxVal: max(croma, 'gas'),
        },
      ];

      return `
        <div class="visor-controls">
          <div class="visor-info">
            <strong>${label}</strong> · Etapa ${etapa} (2500-4162 m MD) ·
            <span class="mono">${params.length} puntos de parámetros · ${croma.length} puntos de cromatografía</span>
          </div>
          <div class="visor-legend">
            <span class="legend-item"><span class="legend-line" style="background:var(--primary)"></span>Parámetros</span>
            <span class="legend-item"><span class="legend-line" style="background:var(--accent)"></span>Densidad</span>
            <span class="legend-item"><span class="legend-line" style="background:var(--gold)"></span>Temperatura</span>
            <span class="legend-item"><span class="legend-line" style="background:var(--warn)"></span>Gas</span>
            <span class="legend-item"><span class="legend-dash"></span>Promedio</span>
            <span class="legend-item"><span class="legend-warn"></span>Manifestación</span>
          </div>
        </div>
        <div class="charts-grid">
          ${charts.map(c => chartCard(
            c.label,
            `${c.unit} · Eje Y: profundidad (m MD)`,
            `${(c.avgVal % 1 === 0 ? c.avgVal.toFixed(0) : c.avgVal.toFixed(2))}`,
            `min ${(c.minVal % 1 === 0 ? c.minVal.toFixed(0) : c.minVal.toFixed(2))} · max ${(c.maxVal % 1 === 0 ? c.maxVal.toFixed(0) : c.maxVal.toFixed(2))}`,
            drawLineChart(c.field === 'gas' ? croma : params, c)
          )).join('')}
        </div>`;
    };

    /* ======================== COMPONENTES ======================== */
    const metricCard = (label, value, sub, trend) => `
      <div class="metric-card">
        <div class="metric-label">${label}</div>
        <div class="metric-value mono">${value}</div>
        ${sub ? `<div class="metric-sub">${sub}</div>` : ''}
        ${trend ? `<div class="metric-trend">${trend}</div>` : ''}
      </div>`;

    const badge = (status) => {
      const map = {
        active: ['badge-active', 'Activa'],
        completed: ['badge-completed', 'Cerrada'],
        manifestation: ['badge-manifestation', 'Manifestación'],
        pending: ['badge-pending', 'Pendiente'],
      };
      const [cls, label] = map[status] || map.pending;
      return `<span class="badge ${cls}"><span class="badge-dot"></span>${label}</span>`;
    };

    const navItem = (icon, label, hash, active=false) => `
      <div class="nav-item ${active ? 'active' : ''}" onclick="navigate('${hash}')">
        ${icon} <span>${label}</span>
      </div>`;

    const cabinSubItem = (cabin, active=false) => `
      <div class="nav-sub-item ${active ? 'active' : ''}" onclick="navigate('#/cabin/${cabin.id}')">${cabin.nombre}</div>`;

    /* ======================== SIDEBAR ======================== */
    const renderSidebar = (activeRoute) => {
      const cabinsOpen = activeRoute.startsWith('cabin');
      return `
        <aside id="sidebar">
          <div class="sidebar-header">

              <img class="logo-img" src="logo.svg" alt="Xabim Alvarez &amp; Asociados" />

            </div>
          </div>
          <nav class="sidebar-nav">
            <div class="nav-section">

                <span style="margin-left:auto">${ICONS.chevron}</span>
              </div>
              <div id="cabins-sub" class="nav-sub ${cabinsOpen ? 'open' : ''}">
                ${MOCK_CABINS.map(c => cabinSubItem(c, activeRoute === 'cabin' && location.hash.includes(c.id))).join('')}
              </div>
            </div>
            <div class="nav-section">
              <div class="nav-label">Reportes</div>
              ${navItem(ICONS.report, 'Reportes', '#/dashboard', false)}

            </div>

              <div class="nav-label">Sistema</div>
              ${navItem(ICONS.settings, 'Configuración', '#/settings', activeRoute === 'settings')}
            </div>
          </nav>
          <div class="sidebar-footer">
            <div class="user-avatar">GG</div>
            <div class="user-info">
              <div class="user-name">${MOCK_USER.nombre}</div>

        </aside>`;
    };

    const renderTopbar = (breadcrumb) => `
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:1rem">
          <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">${ICONS.menu}</button>
          <div class="breadcrumb">${breadcrumb}</div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost" onclick="navigate('#/login')">${ICONS.logout}<span>Salir</span></button>
        </div>
      </div>`;

    /* ======================== VISTAS ======================== */
    const renderLogin = () => `
      <div class="login-screen">
        <div class="login-card">
          <div class="login-logos">
            <img class="login-logo-img" src="logo.svg" alt="Xabim Alvarez &amp; Asociados" />
            <img class="login-logo-slogan" src="slogan.svg" alt="The New Generation · Mining &amp; Geology" />
          </div>
          <p>Panel de control para automatización de reportes geológicos</p>
          <button class="btn-google" onclick="navigate('#/dashboard')">
            ${ICONS.google} Entrar con Google
          </button>
          <div class="login-foot">Acceso demo · No se requiere contraseña</div>
        </div>
      </div>`;

    const renderDashboard = () => {
      const activas = MOCK_CABINS.filter(c => c.estado === 'active').length;
      const reportes = MOCK_REPORTS.length;
      const manif = MOCK_CABINS.reduce((s, c) => s + c.manif_count, 0);
      const gasMax = Math.max(...MOCK_CABINS.map(c => c.gas_max));
      return `
        ${renderTopbar('<strong>Dashboard</strong>')}
        <div class="content">
          <div class="view-header">
            <h1 class="view-title">Buenos días, ${MOCK_USER.nombre.split(' ')[0]}</h1>
            <p class="view-subtitle">Resumen operativo de ${MOCK_USER.empresa} — ${new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
          </div>
          <div class="metrics-grid">
            ${metricCard('Cabinas activas', activas, `${MOCK_CABINS.length} totales`)}
            ${metricCard('Reportes del mes', reportes, '12 últimos 30 días')}
            ${metricCard('Manifestaciones', manif, 'Detectadas en 2022')}
            ${metricCard('Gas máximo', fmt(gasMax) + ' ppm', 'Kali-10 / 26 jul', '+70× background')}
          </div>

          <div class="section-card">
            <div class="section-card-header">
              <h3>Cabinas</h3>
              <div style="display:flex;gap:0.5rem">
                <button class="btn btn-primary" onclick="navigate('#/cabin/new')">+ Nueva cabina</button>
                <button class="btn btn-secondary">${ICONS.upload}<span>Subir CSV</span></button>
              </div>
            </div>
            <div class="cabin-list">
              ${MOCK_CABINS.map(c => `
                <div class="cabin-card" onclick="navigate('#/cabin/${c.id}')">

          <div class="section-card">

    // ============================================================
    // WITSML config (tab Config de cabina)
    // Estados: 'none' | 'active' | 'paused' | 'pending'
    // ============================================================
    let witsmlEditMode = null;  // null = vista, cabinId = editando

    const renderWitsmlConfig = (cabin) => {
      const w = cabin.witsml || { estado: 'none' };
      const estado = w.estado;
      const isEditing = witsmlEditMode === cabin.id;
      const isFormMode = estado === 'none' || isEditing;

      if (isFormMode) {
        const editingExisting = isEditing && estado !== 'none';
        return `
          <div class="section-card">
            <h3>Fuente de datos en tiempo real (WITSML)</h3>
            <p class="view-subtitle" style="margin-bottom:1.2rem">
              Conecta esta cabina directamente al servidor WITSML Store para que el sistema jale lecturas cada 5 minutos sin subir CSVs manualmente. ${editingExisting ? '<span class="badge badge-pending"><span class="badge-dot"></span>Editando</span>' : '<span class="badge badge-completed"><span class="badge-dot"></span>No configurado</span>'}
            </p>
            <div class="form-grid">
              <div class="form-field span-2">
                <label>URL del WITSML Store *</label>
                <input type="text" id="witsml-url-${cabin.id}" placeholder="https://192.168.10.50/witsml/store" value="${w.url || ''}" />
                <span class="help">URL del servidor WITSML dentro de la red de la cabina. No requiere exposición a internet.</span>
              </div>
              <div class="form-field">
                <label>Usuario *</label>
                <input type="text" id="witsml-user-${cabin.id}" placeholder="svc_cabin01" value="${w.username || ''}" />
                <span class="help">Cuenta con permisos de lectura.</span>
              </div>
              <div class="form-field">
                <label>Contraseña *</label>
                <input type="password" id="witsml-pass-${cabin.id}" placeholder="${editingExisting ? '(sin cambios)' : '••••••••'}" value="" />
                <span class="help">Se guarda encriptada. No se muestra después.</span>
              </div>
              <div class="form-field span-2">
                <label>Namespace EML *</label>
                <input type="text" id="witsml-ns-${cabin.id}" placeholder="eml://demo/Kali-10" value="${w.namespace || ''}" />
                <span class="help">Identificador único del pozo en el servidor WITSML.</span>
              </div>
            </div>
            <div style="margin-top:1.2rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <button class="btn btn-secondary" onclick="witsmlTest('${cabin.id}')">${ICONS.check}<span>Probar conexión</span></button>
              <button class="btn btn-primary" onclick="witsmlSave('${cabin.id}')">${editingExisting ? 'Guardar cambios' : 'Activar WITSML'}</button>
              ${editingExisting ? `<button class="btn btn-ghost" onclick="witsmlCancelEdit()">Cancelar</button>` : ''}
            </div>
            <div id="witsml-msg-${cabin.id}" style="margin-top:1rem"></div>
          </div>`;
      }

      // Modo vista: según estado
      const badge = estado === 'active'
        ? '<span class="badge badge-active"><span class="badge-dot"></span>Conectado</span>'
        : estado === 'paused'
        ? '<span class="badge badge-pending"><span class="badge-dot"></span>Pausado</span>'
        : '<span class="badge badge-pending"><span class="badge-dot"></span>Pendiente de probar</span>';

      const accionPrincipal = estado === 'active'
        ? `<button class="btn btn-secondary" onclick="witsmlTogglePause('${cabin.id}')">Pausar</button>`
        : `<button class="btn btn-primary" onclick="witsmlActivate('${cabin.id}')">${estado === 'pending' ? 'Probar y activar' : 'Reactivar'}</button>`;

      return `
        <div class="section-card">
          <h3>Fuente de datos en tiempo real (WITSML) ${badge}</h3>
          <table class="params-table" style="margin-top:1rem">
            <tr><td class="label">URL del Store</td><td class="mono" style="word-break:break-all">${w.url || '—'}</td></tr>
            <tr><td class="label">Usuario</td><td class="mono">${w.username || '—'}</td></tr>
            <tr><td class="label">Namespace</td><td class="mono">${w.namespace || '—'}</td></tr>
            <tr><td class="label">Intervalo de poll</td><td class="mono">cada ${w.poll_interval_min || 5} min</td></tr>
            <tr><td class="label">Última sincronización</td><td>${w.last_sync || '—'}</td></tr>
            <tr><td class="label">Próximo poll</td><td>${w.next_poll || '—'}</td></tr>

            <button class="btn btn-ghost" onclick="witsmlStartEdit('${cabin.id}')">Editar</button>
            <button class="btn btn-ghost" onclick="witsmlTest('${cabin.id}')">Probar conexión</button>
          </div>
          <div id="witsml-msg-${cabin.id}" style="margin-top:1rem"></div>
        </div>`;
    };

    const witsmlGetForm = (cabinId) => ({
      url: document.getElementById(`witsml-url-${cabinId}`).value.trim(),
      username: document.getElementById(`witsml-user-${cabinId}`).value.trim(),
      password: document.getElementById(`witsml-pass-${cabinId}`).value,
      namespace: document.getElementById(`witsml-ns-${cabinId}`).value.trim(),
    });

    const witsmlMsg = (cabinId, html) => {
      const el = document.getElementById(`witsml-msg-${cabinId}`);
      if (el) el.innerHTML = html;
    };

    const witsmlRefresh = () => {
      witsmlEditMode = null;
      const main = document.getElementById('main');
      if (main) main.innerHTML = renderCabin();
    };

    window.witsmlStartEdit = function(cabinId) {
      witsmlEditMode = cabinId;
      witsmlRefresh();
    };
    window.witsmlCancelEdit = function() { witsmlRefresh(); };

    window.witsmlTest = function(cabinId) {
      const form = witsmlGetForm(cabinId);
      if (!form.url || !form.namespace) {
        witsmlMsg(cabinId, '<div class="badge badge-pending" style="display:inline-flex"><span class="badge-dot"></span>Completa URL y namespace antes de probar.</div>');
        return;
      }
      witsmlMsg(cabinId, '<div class="badge badge-pending" style="display:inline-flex"><span class="badge-dot"></span>Probando conexión...</div>');
      // Mock: simula 800ms de latencia, luego ok
      setTimeout(() => {
        witsmlMsg(cabinId, '<div class="badge badge-active" style="display:inline-flex"><span class="badge-dot"></span>Conexión exitosa · WITSML 1.4.1 · namespace OK</div>');
      }, 800);
    };

    window.witsmlSave = function(cabinId) {
      const form = witsmlGetForm(cabinId);
      if (!form.url || !form.username || !form.namespace) {
        witsmlMsg(cabinId, '<div class="badge badge-pending" style="display:inline-flex"><span class="badge-dot"></span>Completa URL, usuario y namespace.</div>');
        return;
      }
      if (!form.password) {
        witsmlMsg(cabinId, '<div class="badge badge-pending" style="display:inline-flex"><span class="badge-dot"></span>Falta la contraseña.</div>');
        return;
      }
      const cabin = MOCK_CABINS.find(c => c.id === cabinId);
      if (!cabin) return;
      const wasNew = !cabin.witsml || cabin.witsml.estado === 'none';
      cabin.witsml = {
        estado: 'active',
        url: form.url,
        username: form.username,
        namespace: form.namespace,
        password_ref: `_secrets/cabin_${cabinId}_witsml`,
        poll_interval_min: cabin.witsml?.poll_interval_min || 5,
        last_sync: 'hace un momento',
        next_poll: `en ${cabin.witsml?.poll_interval_min || 5} min`,
        total_readings: cabin.witsml?.total_readings || 0,
      };
      witsmlRefresh();
      showToast(wasNew ? `WITSML activado en ${cabin.nombre}` : `WITSML actualizado en ${cabin.nombre}`);
    };

    window.witsmlActivate = function(cabinId) {
      const cabin = MOCK_CABINS.find(c => c.id === cabinId);
      if (!cabin) return;
      cabin.witsml.estado = 'active';
      cabin.witsml.last_sync = 'hace un momento';
      cabin.witsml.next_poll = `en ${cabin.witsml.poll_interval_min || 5} min`;
      witsmlRefresh();
      showToast(`WITSML reactivado en ${cabin.nombre}`);
    };

    window.witsmlTogglePause = function(cabinId) {
      const cabin = MOCK_CABINS.find(c => c.id === cabinId);
      if (!cabin) return;
      cabin.witsml.estado = cabin.witsml.estado === 'active' ? 'paused' : 'active';
      if (cabin.witsml.estado === 'active') {
        cabin.witsml.last_sync = 'hace un momento';
        cabin.witsml.next_poll = `en ${cabin.witsml.poll_interval_min || 5} min`;

    const renderCabin = () => {

        manifestaciones: `

              <div class="cabin-card" style="cursor:default" onclick="navigate('#/manifestation/${MOCK_MANIFEST.id}')">
                <div class="cabin-icon" style="background:var(--warn-soft);color:var(--warn)">${ICONS.alert}</div>

                  <div class="cabin-name">Manifestación No. 2 — ${MOCK_MANIFEST.fecha}</div>
                  <div class="cabin-meta">Profundidad ${fmt(MOCK_MANIFEST.profundidad)} m · Gas ${fmt(MOCK_MANIFEST.gas_lectura)} ppm · Factor ${MOCK_MANIFEST.factor_pico}×</div>
                </div>
                <button class="btn btn-secondary">Ver reporte →</button>
              </div>` : '<p class="view-subtitle">No se han detectado manifestaciones en este pozo.</p>'}
          </div>`,
        config: `
          <div class="section-card">
            <h3>Configuración de la cabina</h3>
            <table class="params-table">
              <tr><td class="label">Empresa operadora</td><td>${cabin.empresa}</td></tr>

              <tr><td class="label">Umbral gas (alerta)</td><td class="num mono">2,000 ppm</td></tr>

              <tr><td class="label">Archivos cargados</td><td>${cabin.archivos_cargados || 0} de 8</td></tr>
            </table>

                  ${a.key === 'atlas_litologico' ? '<path d="M3 3h18v18H3z"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>' : ''}
                  ${a.key === 'paleontologia' ? '<circle cx="12" cy="8" r="4"/><path d="M6 22c0-4 2-7 6-7s6 3 6 7"/>' : ''}
                  ${a.key === 'survey' ? '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/><path d="M3 3l18 18"/>' : ''}
                  ${a.key === 'barrena' ? '<circle cx="12" cy="12" r="3"/><path d="M3 12h6M15 12h6M12 3v6M12 15v6"/>' : ''}
                </svg>
              </div>
              <div class="upload-item-body">
                <div class="upload-item-head">
                  <h4>${a.titulo}</h4>
                  ${fileStatus(a.key, archivos)}
                </div>
                <p class="upload-item-desc">${a.descripcion}</p>
                <div class="upload-item-genera">
                  <strong>Genera:</strong> ${a.genera.join(' · ')}
                </div>
              </div>
              <div class="upload-item-action">
                ${fileButton(a.key, archivos, cabinId)}
              </div>
            </div>`;
          }).join('')}
        </div>`;
    };

    const renderStep4 = () => {
      const cargados = ARCHIVOS_REQUERIDOS.filter(a => {
        if (a.key === 'ejemplos_siop') return wizardData.archivos[a.key].length > 0;
        return wizardData.archivos[a.key] !== null;
      }).length;
      const total = ARCHIVOS_REQUERIDOS.length;

      // Calcular qué documentos se podrán generar según archivos cargados
      const docs = [
        { nombre: 'SIOP (todos los turnos)', ok: !!wizardData.archivos.parametros, requerido: true },
        { nombre: 'CDO Matutino y Vespertino', ok: !!wizardData.archivos.parametros, requerido: true },
        { nombre: 'DCF Avance de Fluidos', ok: !!wizardData.archivos.parametros, requerido: true },
        { nombre: 'Boleta Diaria', ok: !!wizardData.archivos.parametros, requerido: true },
        { nombre: 'Lookahead', ok: !!wizardData.archivos.parametros, requerido: true },
        { nombre: 'Reporte de Manifestación', ok: !!wizardData.archivos.cromatografia, requerido: true },
        { nombre: 'Sección de Litología', ok: !!wizardData.archivos.atlas_litologico, requerido: false },
        { nombre: 'Sección de Paleontología', ok: !!wizardData.archivos.paleontologia, requerido: false },
        { nombre: 'Comparación Survey', ok: !!wizardData.archivos.survey, requerido: false },
        { nombre: 'Performance de Barrena', ok: !!wizardData.archivos.barrena, requerido: false },
        { nombre: 'Estilo Pemex personalizado', ok: wizardData.archivos.ejemplos_siop.length >= 3 || !!wizardData.archivos.plantilla_siop, requerido: false },
      ];

      return `
        <div class="section-card">
          <h3>Archivos de la cabina</h3>
          <p class="view-subtitle" style="margin-bottom:0.5rem">Sube los archivos que tu cabina genera. El sistema los usa para producir automáticamente los documentos de salida (SIOPs, CDOs, DCF, etc).</p>
          <p class="view-subtitle muted" style="margin-bottom:1.5rem">
            <strong>${cargados} de ${total} archivos cargados.</strong>
            Los archivos marcados como <em>Requerido</em> son los mínimos para que el sistema pueda generar los reportes básicos.
          </p>

          <div class="upload-list">
            ${renderArchivosList(wizardData.archivos, null)}
          </div>
        </div>

        <div class="section-card">
          <h3>Lo que el sistema podrá generar con estos archivos</h3>
          <p class="view-subtitle" style="margin-bottom:1rem">Resumen dinámico: estos documentos se generarán automáticamente según los archivos que subas.</p>
          <div class="docs-grid">
            ${docs.map(d => `
              <div class="doc-item ${d.ok ? 'ok' : 'pending'}">
                <span class="doc-check">${d.ok ? '✓' : '○'}</span>
                <span>${d.nombre}</span>
                ${d.requerido ? '<span class="doc-tag">requerido</span>' : '<span class="doc-tag optional">opcional</span>'}
              </div>
            `).join('')}
          </div>
          <p class="view-subtitle muted" style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line-soft)">
            <strong>Tip:</strong> puedes crear la cabina ahora y subir los archivos después desde la configuración de la cabina. El sistema empezará a generar reportes en automático cuando tenga los datos mínimos.
          </p>
        </div>
      `;
    };

    const renderStep5 = () => {
      const w = wizardData.witsml;
      const statusBadge = w.configurar
        ? '<span class="badge badge-pending"><span class="badge-dot"></span>Por activar al crear</span>'
        : '<span class="badge badge-completed"><span class="badge-dot"></span>No configurado</span>';
      return `
        <div class="section-card">
          <h3>Fuente de datos en tiempo real (WITSML)</h3>
          <p class="view-subtitle" style="margin-bottom:1.2rem">
            Si tu cabina expone un servidor WITSML Store (versión 1.4.1 o 2.0), el sistema puede jalar datos cada 5 minutos sin que subas CSVs. Es opcional — si tu cabina no expone WITSML todavía, créala sin esto y configúralo después. ${statusBadge}
          </p>

          <div class="form-field" style="margin-bottom:1.2rem">
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
              <input type="checkbox" ${w.configurar?'checked':''} onchange="wizardData.witsml.configurar=this.checked; rerenderWizard()" style="width:18px;height:18px;cursor:pointer" />
              <span><strong>Configurar WITSML en el alta</strong> — llena los datos de conexión ahora</span>
            </label>
          </div>

          ${w.configurar ? `
            <div class="form-grid">
              <div class="form-field span-2">
                <label>URL del WITSML Store *</label>
                <input type="text" placeholder="https://192.168.10.50/witsml/store" value="${w.url}" oninput="wizardData.witsml.url=this.value" />
                <span class="help">URL del servidor WITSML dentro de la red de la cabina. No requiere exposición a internet.</span>
              </div>
              <div class="form-field">
                <label>Usuario *</label>
                <input type="text" placeholder="svc_cabin01" value="${w.username}" oninput="wizardData.witsml.username=this.value" />
                <span class="help">Cuenta con permisos de lectura.</span>
              </div>
              <div class="form-field">
                <label>Contraseña *</label>
                <input type="password" placeholder="••••••••" value="${w.password}" oninput="wizardData.witsml.password=this.value" />
                <span class="help">Se guarda encriptada. No se muestra después.</span>
              </div>
              <div class="form-field span-2">
                <label>Namespace EML *</label>
                <input type="text" placeholder="eml://demo/Kali-10" value="${w.namespace}" oninput="wizardData.witsml.namespace=this.value" />
                <span class="help">Identificador único del pozo en el servidor. Lo encuentras en la config del WITSML Store de la cabina.</span>
              </div>
            </div>
            <div style="margin-top:1rem;padding:12px 16px;background:var(--primary-soft);border-radius:8px;font-size:13px;color:var(--ink-2);line-height:1.5">
              <strong style="color:var(--primary)">Al activar:</strong> el sistema corre una prueba de conexión. Si falla, no se guarda la configuración y te avisamos para que corrijas la URL o las credenciales. Las contraseñas se guardan en un almacén encriptado separado (<code>_secrets/</code>), no en el documento visible de la cabina.
            </div>
          ` : `
            <div style="padding:16px 20px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;font-size:13.5px;color:var(--ink-2);line-height:1.6">
              <strong style="color:var(--ink)">Sin WITSML por ahora.</strong> Cuando la cabina exponga el servidor, entra a <em>Configuración de la cabina → Fuente WITSML</em> y agrégalo en 30 segundos. La cabina ya creada puede seguir operando con CSVs mientras tanto.
            </div>
          `}
        </div>
      `;
    };

    const renderStep6 = () => {
      const items = [
        ['Nombre del pozo', wizardData.nombre],
        ['Campo', wizardData.campo],
        ['Empresa operadora', wizardData.empresa],
        ['Operador petrolero', wizardData.operador],
        ['Coordinador', wizardData.coordinador || '—'],
        ['Formación objetivo', wizardData.formacion],
        ['Profundidad total', wizardData.prof_total + ' m MD'],
        ['Etapa actual', wizardData.etapa_actual || '—'],
        ['Etapas planeadas', wizardData.etapas_planeadas || '—'],
        ['Inicio', wizardData.inicio || '—'],
        ['Fin estimado', wizardData.fin_estimada || '—'],
        ['Equipo', wizardData.equipo || '—'],
        ['Coordenadas', wizardData.coordenadas || '—'],
        ['Geólogos asignados', wizardData.geologos],
        ['Umbral gas', wizardData.umbral_gas + ' ppm'],
        ['Factor pico manifestación', wizardData.factor_pico + '×'],
        ['Auto SIOP', wizardData.auto_siop_hora + ' hrs'],
        ['Notificaciones', [wizardData.notif_email?'Email':'', wizardData.notif_sms?'SMS':''].filter(Boolean).join(' + ') || '—'],
        ['Fuente WITSML', wizardData.witsml.configurar
          ? `${wizardData.witsml.url} · ns ${wizardData.witsml.namespace}`
          : 'No configurado (puede agregarse después)'],
      ];
      return `
        <div class="section-card">
          <h3>Confirmar datos de la nueva cabina</h3>
          <p class="view-subtitle" style="margin-bottom:1.5rem">Revisa que todo esté correcto antes de crear la cabina.</p>
          <div class="summary-list">
            ${items.map(([l,v]) => `<div class="summary-item"><span class="label">${l}</span><span class="value">${v}</span></div>`).join('')}
          </div>
        </div>`;
    };

    const renderWizard = () => {
      const stepContent = wizardStep === 1 ? renderStep1()
                         : wizardStep === 2 ? renderStep2()
                         : wizardStep === 3 ? renderStep3()
                         : wizardStep === 4 ? renderStep4()
                         : wizardStep === 5 ? renderStep5()
                         : renderStep6();
      const isConfirm = wizardStep === 6;
      const totalInputs = 5; // Pasos 1-5 son inputs, paso 6 es confirmación
      return `
        ${renderTopbar('<strong>Cabinas</strong> / <strong>Nueva cabina</strong>')}
        <div class="content">
          <div class="view-header">
            <h1 class="view-title">Nueva cabina</h1>
            <p class="view-subtitle">Configura el pozo, equipo, usuarios, archivos y fuente de datos${isConfirm ? ' · Confirmación' : ' · Paso ' + wizardStep + ' de ' + totalInputs}.</p>
          </div>
          ${renderStepper()}
          ${stepContent}
          <div class="form-actions">
            <button class="btn btn-secondary" onclick="wizardPrev()" ${wizardStep===1?'disabled':''} style="${wizardStep===1?'opacity:0.4;cursor:not-allowed':''}">← Atrás</button>
            <div class="right">
              <button class="btn btn-ghost" onclick="wizardCancel()">Cancelar</button>
              ${isConfirm
                ? `<button class="btn btn-primary" onclick="wizardFinish()">${ICONS.check}<span>Crear cabina</span></button>`
                : `<button class="btn btn-primary" onclick="wizardNext()">Siguiente →</button>`}
            </div>
          </div>
        </div>`;
    };

    const rerenderWizard = () => {
      const main = document.getElementById('main');
      if (main) main.innerHTML = renderWizard();
      window.scrollTo(0, 0);
    };

    const wizardNext = () => {
      if (wizardStep <= wizardSteps.length) {
        const v = wizardSteps[wizardStep - 1].validate();
        if (!v.ok) { showToast(v.msg); return; }
      }
      if (wizardStep < 6) { wizardStep++; rerenderWizard(); }
    };
    const wizardPrev = () => { if (wizardStep > 1) { wizardStep--; rerenderWizard(); } };
    const wizardCancel = () => { resetWizard(); navigate('#/dashboard'); };
    const wizardFinish = () => {
      const id = wizardData.nombre.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const archivosCargados = Object.entries(wizardData.archivos).filter(([k, v]) => {
        if (Array.isArray(v)) return v.length > 0;
        return v !== null;
      }).length;
      MOCK_CABINS.push({
        id, nombre: wizardData.nombre, campo: wizardData.campo, empresa: wizardData.empresa,
        equipo: wizardData.equipo || 'Por asignar', operador: wizardData.operador,
        etapa: wizardData.etapa_actual || 'Por definir',
        profundidad_total: parseInt(wizardData.prof_total) || 0,
        inicio: wizardData.inicio || 'Por definir', fin: wizardData.fin_estimada || null,
        dias_op: 0, formacion: wizardData.formacion, estado: 'active',
        metros_hoy: 0, rop_prom: 0, gas_max: 0, manif_count: 0,
        archivos_cargados: archivosCargados,
        archivos: wizardData.archivos,
        witsml: wizardData.witsml.configurar
          ? {
              estado: 'pending',  // aún no se probó la conexión
              url: wizardData.witsml.url,
              username: wizardData.witsml.username,
              namespace: wizardData.witsml.namespace,
              password_ref: `_secrets/cabin_${id}_witsml`,
              last_sync: '—',
              next_poll: '—',
              poll_interval_min: 5,
              total_readings: 0,
            }
          : { estado: 'none' },
      });
      const witsmlMsg = wizardData.witsml.configurar ? ' · WITSML pendiente de probar' : '';
      showToast(`Cabina ${wizardData.nombre} creada · ${archivosCargados} archivos${witsmlMsg}`);
      resetWizard();
      navigate('#/dashboard');
    };

    /* ======================== ROUTER ======================== */
    const routes = {
      'login': renderLogin,
      'dashboard': renderDashboard,
      'cabin': renderCabin,
      'cabin-upload': renderUpload,
      'report': renderReport,
      'manifestation': renderManifest,
      'settings': renderSettings,
    };

    function renderRoute() {
      const hash = location.hash.replace('#/', '') || 'login';
      const app = document.getElementById('app');
      if (hash === 'login' || hash === '') {
        app.innerHTML = renderLogin();
        return;
      }
      if (hash === 'cabin/new') {
        app.innerHTML = renderSidebar('cabin') + '<div id="main">' + renderWizard() + '</div>';
        return;
      }
      if (hash.startsWith('cabin/') && hash.includes('/upload')) {
        app.innerHTML = renderSidebar('cabin') + '<div id="main">' + renderUpload() + '</div>';
        return;
      }
      if (hash.startsWith('cabin/')) {
        app.innerHTML = renderSidebar('cabin') + '<div id="main">' + renderCabin() + '</div>';
        return;
      }
      if (hash.startsWith('report/')) {
        app.innerHTML = renderSidebar('dashboard') + '<div id="main">' + renderReport() + '</div>';
        return;
      }
      if (hash.startsWith('manifestation/')) {
        app.innerHTML = renderSidebar('manifestation') + '<div id="main">' + renderManifest() + '</div>';
        return;
      }
      const fn = routes[hash] || renderDashboard;
      app.innerHTML = renderSidebar(hash) + '<div id="main">' + fn() + '</div>';
    }

    window.addEventListener('hashchange', renderRoute);
    window.addEventListener('load', renderRoute);
    if (document.readyState === 'complete') renderRoute();
  </script>
</body>
</html>
